<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a2352" />
  <title>ВТБ Смарт-сделка – мобильная версия</title>
  <style>
    @font-face { font-family: Inter; src: url('/fonts/inter-tight.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; font-family: Inter, system-ui, sans-serif; color: #0a2352; background: #edf2f9; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: center; padding: 22px 40px; }
    header > div { display: flex; align-items: baseline; gap: 16px; }
    strong { font-weight: 800; font-size: 26px; letter-spacing: -1px; }
    h1 { margin: 0; font-size: 18px; font-weight: 550; }
    a { color: #0057c2; font-size: 14px; padding: 12px; border: 1px solid #ccdaed; border-radius: 10px; text-decoration: none; }
    a:focus-visible { outline: 3px solid #0057c2; outline-offset: 3px; }
    main { display: flex; justify-content: center; padding: 12px 16px 28px; }
    .phone { width: 414px; height: min(868px, calc(100dvh - 120px)); min-height: 500px; padding: 11px; background: #0a2352; border: 1px solid #27446f; border-radius: 42px; box-shadow: 0 20px 70px #0a23521c; }
    iframe { width: 100%; height: 100%; display: block; border: 0; border-radius: 31px; background: #f5f7fa; }
    @media (max-width: 600px) { header { display: none; } main { padding: 0; } .phone { width: 100%; min-height: 100dvh; height: 100dvh; padding: 0; border: 0; border-radius: 0; } iframe { border-radius: 0; } }
  </style>
</head>
<body>
  <header><div><strong>ВТБ</strong><h1>Смарт-сделка · мобильная версия</h1></div><a href="/">Открыть на весь экран</a></header>
  <main><div class="phone"><iframe src="/" title="Мобильная версия ВТБ Смарт-сделка" allow="clipboard-write"></iframe></div></main>
  <script>if (matchMedia('(max-width: 600px)').matches) location.replace('/');</script>
</body>
</html>
